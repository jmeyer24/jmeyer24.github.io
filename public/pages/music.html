<div class="content-wrapper">
    <ul id="medical-list"></ul>
</div>
<script>
    $.get("content/house_md.txt", function (data) {
        var lines = data.split(/[\r\n]+/);

        $.each(lines, function (i, line) {
            if (line.trim() !== '') {
                $("#medical-list").append($('<li></li>').text(line));
            }
        });
    });
</script>
